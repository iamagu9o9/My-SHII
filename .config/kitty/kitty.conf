# ---------- Font ----------
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
disable_ligatures never

# ---------- Window ----------
background_opacity        0.65
dynamic_background_opacity yes
window_padding_width      12
hide_window_decorations   yes
confirm_os_window_close   0
remember_window_size      no
enabled_layouts           splits,stack

# ---------- Cursor ----------
cursor_shape              beam
cursor_beam_thickness     1.5
cursor_blink_interval     0
cursor                    #e6e6e6
cursor_text_color         #101010

# ---------- Scrollback / misc ----------
scrollback_lines          5000
mouse_hide_wait           3.0
enable_audio_bell         no
copy_on_select            clipboard
tab_bar_style             hidden
shell_integration         enabled

# ---------- Grayscale colors ----------
foreground                #d0d0d0
background                #0a0a0a
selection_foreground      #0a0a0a
selection_background      #cfcfcf
url_color                 #ffffff

# black
color0   #1a1a1a
color8   #4a4a4a
# red
color1   #8a8a8a
color9   #a8a8a8
# green
color2   #9a9a9a
color10  #b8b8b8
# yellow
color3   #aaaaaa
color11  #c8c8c8
# blue
color4   #7a7a7a
color12  #9a9a9a
# magenta
color5   #8f8f8f
color13  #adadad
# cyan
color6   #a0a0a0
color14  #bebebe
# white
color7   #d0d0d0
color15  #ffffff

# ---------- Keys ----------
map ctrl+shift+equal  change_font_size all +1.0
map ctrl+shift+minus  change_font_size all -1.0
map ctrl+shift+0      change_font_size all 0
map ctrl+shift+o      set_background_opacity -0.05
map ctrl+shift+p      set_background_opacity +0.05

# ---------- Dynamic Wallpaper Colors (pywal) ----------
include colors-kitty.conf
allow_remote_control yes
