source = ~/.config/hypr/colors-hyprlock.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = /home/iamagu/.cache/lockwall.png
    blur_passes = 2
    blur_size = 5
    brightness = 0.75
    vignette_strength = 0.3
}

# Welcome!
label {
    monitor =
    text = Welcome!
    color = $fg
    font_size = 64
    font_family = JetBrainsMono Nerd Font Bold
    position = 90, -150
    halign = left
    valign = top
}

# time
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $fg
    font_size = 36
    font_family = JetBrainsMono Nerd Font Bold
    position = 90, -235
    halign = left
    valign = top
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = $dim
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 90, -290
    halign = left
    valign = top
}

# username pill
shape {
    monitor =
    size = 240, 40
    color = rgba(255, 255, 255, 0.08)
    rounding = 20
    border_size = 1
    border_color = rgba(255, 255, 255, 0.12)
    position = 90, -140
    halign = left
    valign = center
}
label {
    monitor =
    text =   $USER
    color = $fg
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 112, -140
    halign = left
    valign = center
}

# password pill
input-field {
    monitor =
    size = 240, 40
    rounding = 20
    outline_thickness = 1
    outer_color = rgba(255, 255, 255, 0.12)
    inner_color = rgba(255, 255, 255, 0.08)
    font_color = $fg
    check_color = $accent2
    fail_color = rgba(ff5555ff)
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.3
    placeholder_text =   Enter Pass
    fail_text = <i>$FAIL</i>
    position = 90, -90
    halign = left
    valign = center
}

# now playing card
shape {
    monitor =
    size = 320, 72
    color = rgba(255, 255, 255, 0.08)
    rounding = 14
    border_size = 1
    border_color = rgba(255, 255, 255, 0.12)
    position = 90, 50
    halign = left
    valign = bottom
}
image {
    monitor =
    path = /home/iamagu/.cache/lock-art.png
    size = 56
    rounding = 10
    reload_time = 5
    reload_cmd = /home/iamagu/.config/hypr/scripts/lock-media.sh art
    position = 100, 58
    halign = left
    valign = bottom
}
label {
    monitor =
    text = cmd[update:3000] echo "  $(/home/iamagu/.config/hypr/scripts/lock-media.sh app)"
    color = $dim
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 168, 108
    halign = left
    valign = bottom
}
label {
    monitor =
    text = cmd[update:3000] /home/iamagu/.config/hypr/scripts/lock-media.sh title
    color = $fg
    font_size = 13
    font_family = JetBrainsMono Nerd Font Bold
    position = 168, 88
    halign = left
    valign = bottom
}
label {
    monitor =
    text = cmd[update:3000] /home/iamagu/.config/hypr/scripts/lock-media.sh artist
    color = $dim
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 168, 68
    halign = left
    valign = bottom
}
